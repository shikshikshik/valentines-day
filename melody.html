<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melody for You</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h2>songs that reminds me of you</h2>
    <br></br>

    <div class="heart-container">
        <div class="row top">
            <img src="datas/heart1.jpg" class="heart" data-song="datas/song1.mp3" alt="lucky">
            <p style="color: hotpink;">I love you</p>

            <img src="datas/heart2.jpg" class="heart" data-song="datas/song2.mp3" alt="Everything I Want">
        </div>
        <div class="row middle">
            <img src="datas/heart3.jpg" class="heart" data-song="datas/song3.mp3" alt="Snooze">
            <img src="datas/heart4.jpg" class="heart" data-song="datas/song4.mp3" alt="Song 4">
            <img src="datas/heart5.jpg" class="heart" data-song="datas/song5.mp3" alt="Song 5">
            <img src="datas/heart6.jpg" class="heart" data-song="datas/song6.mp3" alt="Song 6">
        </div>
        <div class="row lower">
            <img src="datas/heart7.jpg" class="heart" data-song="datas/song7.mp3" alt="Song 7">
            <img src="datas/heart8.jpg" class="heart" data-song="datas/song8.mp3" alt="Song 8">
            <img src="datas/heart9.jpg" class="heart" data-song="datas/song9.mp3" alt="Song 9">
        </div>
        <div class="row bottom">
            <img src="datas/heart10.jpg" class="heart" data-song="datas/song10.mp3" alt="Song 10">
        </div>
    </div>

    <audio id="audio-player"></audio>

    <button id="back-button">Back</button>

    <script src="melody.js"></script>
</body>
</html>
