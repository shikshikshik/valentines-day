<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Carousel</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h2>Memories With You</h2>

    <div class="carousel-container">
        <button class="left">&#10094;</button>
        <div class="carousel-wrapper">
            <div class="carousel">
                <img src="images/1.jng" class="carousel-image">
                <img src="images/2.png" class="carousel-image">
               
                <img src="images/4.png" class="carousel-image">
                <img src="images/5.png" class="carousel-image">
                <img src="images/6.png" class="carousel-image">
                <img src="images/7.png" class="carousel-image">
                <img src="images/8.png" class="carousel-image">
                <img src="images/9.png" class="carousel-image">
                <img src="images/10.png" class="carousel-image">
                <img src="images/11.png" class="carousel-image">
                <img src="images/3.png" class="carousel-image">
                <img src="images/12.png" class="carousel-image">
                <img src="images/2.png" class="carousel-image">
               
            </div>
        </div>
        <button class="right">&#10095;</button>
    </div>

    <div id="popup">
        <span id="close-popup">&times;</span>
        <img id="popup-image" src=""/>
    </div>
    <a href="options.html" class="back-button">Back to Options</a>

    <script src="memories.js"></script>
</body>
</html>
