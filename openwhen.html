<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open When You Need Me</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h2>Open When You are...</h2>
    <p>Click to read a message.</p>

    
    <div class="open-me-container">
        <div class="image-wrapper">
            <img src="letter/letter1.png" class="open-me-image" alt="Letter 1">
            <span class="image-text">Open When You're Excited</span>
        </div>
        <div class="image-wrapper">
            <img src="letter/letter2.png" class="open-me-image" alt="Letter 2">
            <span class="image-text">Open When You're Overthinking</span>
        </div>
        <div class="image-wrapper">
            <img src="letter/letter3.png" class="open-me-image" alt="Letter 3">
            <span class="image-text">Open When You're Angry</span>
        </div>
        <div class="image-wrapper">
            <img src="letter/letter4.png" class="open-me-image" alt="Letter 4">
            <span class="image-text">Open When You're lost and just wants to disappear</span>
        </div>
        <div class="image-wrapper">
            <img src="letter/letter5.png" class="open-me-image" alt="Letter 5">
            <span class="image-text">Open When You feel lonely</span>
        </div>
    </div>
    
    <div id="popup">
        <span id="close-popup">&times;</span>
        <img id="popup-image" src="">
    </div>

    <a href="options.html" class="back-button">Back to Options</a>

    <script src="openwhen.js"></script> 
</body>
</html>
